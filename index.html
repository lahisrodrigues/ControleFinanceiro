<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar">
            <div class="perfil">
                <h3>Perfil: Lais</h3>
                <p>Perfil de Investidor: Conservador</p>
            </div>
            
            <nav class="menu-meses">
                <button>Entradas</button>
                <button>Saídas</button>
                <button>Total</button>
                <button>Ver Todos os Meses</button>
            </nav>
        </aside>

        <main class="conteudo-central">
            
            <div class="acoes">
                <button class="btn-receita">Entrada de Receita</button>
                <button class="btn-despesa">Entrada de Despesa</button>
            </div>

            <div class="listas-container">
                <div class="lista-receitas">
                    <h4>Todas as Receitas</h4>
                    </div>
                
                <div class="lista-despesas">
                    <h4>Todas as Despesas</h4>
                    </div>
            </div>

            <div class="barra-total">
                <h2>Total Final: R$ 0,00</h2>
            </div>
        </main>

        <aside class="painel-graficos">
            <div class="grafico-consumo">
                <h4>Aqui vai o gráfico de consumo</h4>
            </div>
        </aside>

    </div>

</body>
</html>
